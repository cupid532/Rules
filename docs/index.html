<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Rules · 规则搜索器</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: rgba(17, 25, 48, .82);
      --panel-strong: #151e38;
      --line: rgba(170, 190, 230, .16);
      --text: #edf3ff;
      --muted: #9aa8c4;
      --accent: #83a9ff;
      --accent-strong: #5d88ff;
      --good: #76e0b5;
      --shadow: 0 20px 70px rgba(0, 0, 0, .28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(93, 136, 255, .26), transparent 34rem),
        radial-gradient(circle at 92% 12%, rgba(118, 224, 181, .12), transparent 30rem),
        var(--bg);
    }
    a { color: inherit; }
    .wrap { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
    header { padding: 56px 0 28px; }
    .eyebrow { color: var(--good); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; }
    h1 { margin: 10px 0 8px; font-size: clamp(32px, 6vw, 58px); line-height: 1.05; letter-spacing: -.04em; }
    .intro { max-width: 720px; color: var(--muted); margin: 0; font-size: 16px; }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 160px 160px;
      gap: 10px;
      margin: 26px 0 18px;
    }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(9, 14, 31, .72);
      color: var(--text);
      padding: 12px 14px;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(131, 169, 255, .14); }
    .meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; margin-bottom: 12px; }
    .meta strong { color: var(--text); }
    .status { color: var(--muted); }
    .status.ok { color: var(--good); }
    .status.warn { color: #ffd479; }
    .grid { display: grid; gap: 10px; }
    .card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }
    .name { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 3px; }
    .name strong { font-size: 16px; }
    .path { color: var(--muted); font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    .tag { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; color: var(--accent); font-size: 11px; }
    .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    button, .button {
      cursor: pointer;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 11px;
      color: var(--text);
      background: var(--panel-strong);
      text-decoration: none;
      font: inherit;
      font-size: 13px;
    }
    button:hover, .button:hover { border-color: var(--accent); background: rgba(93, 136, 255, .18); }
    .primary { border-color: rgba(131, 169, 255, .4); background: rgba(93, 136, 255, .2); }
    .empty { padding: 42px 18px; border: 1px dashed var(--line); border-radius: 16px; color: var(--muted); text-align: center; }
    footer { padding: 38px 0 48px; color: var(--muted); font-size: 13px; }
    @media (max-width: 720px) {
      header { padding-top: 36px; }
      .toolbar { grid-template-columns: 1fr; }
      .card { grid-template-columns: 1fr; }
      .actions { justify-content: flex-start; }
      .meta { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="eyebrow">Personal rule collection</div>
      <h1>规则搜索器</h1>
      <p class="intro">搜索、筛选并复制规则集地址。列表会自动从 GitHub 同步，排序为：数字 → 英文字母 → 特殊字符。</p>
      <div class="toolbar" role="search">
        <input id="search" type="search" placeholder="搜索文件名、路径或格式…" autocomplete="off">
        <select id="client" aria-label="筛选客户端">
          <option value="all">全部客户端</option>
          <option value="mihomo">Mihomo</option>
          <option value="sing-box">sing-box</option>
          <option value="other">通用</option>
        </select>
        <select id="format" aria-label="筛选格式">
          <option value="all">全部格式</option>
          <option value="yaml">YAML</option>
          <option value="json">JSON</option>
          <option value="list">LIST</option>
          <option value="srs">SRS</option>
          <option value="mrs">MRS</option>
        </select>
      </div>
      <div class="meta">
        <span id="count"><strong>0</strong> 个规则文件</span>
        <span id="status" class="status">正在同步 GitHub…</span>
      </div>
    </header>

    <section id="results" class="grid" aria-live="polite"></section>

    <footer>
      <span>Rules · 个人自用 Mihomo / sing-box 分流规则</span>
    </footer>
  </main>

  <script>
    const REPO = {
      owner: "cupid532",
      name: "Rules",
      branch: "main"
    };
    const API = `https://api.github.com/repos/${REPO.owner}/${REPO.name}/git/trees/${REPO.branch}?recursive=1`;
    const RAW = `https://raw.githubusercontent.com/${REPO.owner}/${REPO.name}/${REPO.branch}/`;
    const WEB = `https://github.com/${REPO.owner}/${REPO.name}/blob/${REPO.branch}/`;
    const allowed = new Set(["yaml", "yml", "json", "list", "srs", "mrs", "txt"]);
    const fallback = [
      "rules/mihomo/ai.yaml",
      "rules/sing-box/ai.json",
      "rules/sing-box/ai.srs",
      "rules/ai.list"
    ];
    const state = { items: [], query: "", client: "all", format: "all" };
    const collator = new Intl.Collator("en", { numeric: true, sensitivity: "base" });

    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
    }[char]));
    const extension = (path) => path.split(".").pop().toLowerCase();
    const basename = (path) => path.split("/").pop().replace(/\.[^.]+$/, "");
    const clientOf = (path) => {
      if (path.includes("/mihomo/")) return "mihomo";
      if (path.includes("/sing-box/")) return "sing-box";
      return "other";
    };
    const displayClient = (client) => ({ mihomo: "Mihomo", "sing-box": "sing-box", other: "通用" }[client]);
    const bucket = (name) => {
      const first = [...name.trim()][0] || "";
      if (/\d/.test(first)) return 0;
      if (/[A-Za-z]/.test(first)) return 1;
      return 2;
    };
    const normalize = (path) => ({
      path,
      name: basename(path),
      ext: extension(path),
      client: clientOf(path),
      raw: RAW + path,
      web: WEB + path
    });
    const sortItems = (items) => [...items].sort((a, b) =>
      bucket(a.name) - bucket(b.name) ||
      collator.compare(a.name, b.name) ||
      collator.compare(a.path, b.path)
    );
    const isRuleFile = (path) => path.startsWith("rules/") && allowed.has(extension(path));

    function filtered() {
      const q = state.query.trim().toLowerCase();
      return sortItems(state.items.filter((item) => {
        const matchesQuery = !q || `${item.path} ${item.name} ${item.client} ${item.ext}`.toLowerCase().includes(q);
        const matchesClient = state.client === "all" || item.client === state.client;
        const matchesFormat = state.format === "all" || item.ext === state.format;
        return matchesQuery && matchesClient && matchesFormat;
      }));
    }

    function render() {
      const items = filtered();
      $("count").innerHTML = `<strong>${items.length}</strong> 个规则文件`;
      if (!items.length) {
        $("results").innerHTML = `<div class="empty">没有找到匹配的规则文件。</div>`;
        return;
      }
      $("results").innerHTML = items.map((item) => `
        <article class="card">
          <div>
            <div class="name">
              <strong>${escapeHtml(item.name)}</strong>
              <span class="tag">${escapeHtml(displayClient(item.client))}</span>
              <span class="tag">.${escapeHtml(item.ext)}</span>
            </div>
            <div class="path">${escapeHtml(item.path)}</div>
          </div>
          <div class="actions">
            <button class="primary" data-copy="${escapeHtml(item.raw)}">复制 Raw</button>
            <a class="button" href="${escapeHtml(item.raw)}" target="_blank" rel="noopener">打开 Raw</a>
            <a class="button" href="${escapeHtml(item.web)}" target="_blank" rel="noopener">GitHub</a>
          </div>
        </article>
      `).join("");
      document.querySelectorAll("[data-copy]").forEach((button) => {
        button.addEventListener("click", async () => {
          const original = button.textContent;
          try {
            await navigator.clipboard.writeText(button.dataset.copy);
            button.textContent = "已复制";
          } catch {
            window.prompt("复制 Raw 地址：", button.dataset.copy);
          }
          setTimeout(() => { button.textContent = original; }, 1400);
        });
      });
    }

    function setStatus(text, kind = "") {
      $("status").textContent = text;
      $("status").className = `status ${kind}`;
    }

    async function load() {
      try {
        const response = await fetch(API, { headers: { Accept: "application/vnd.github+json" } });
        if (!response.ok) throw new Error(`GitHub API ${response.status}`);
        const data = await response.json();
        state.items = (data.tree || []).filter((entry) => entry.type === "blob" && isRuleFile(entry.path)).map((entry) => normalize(entry.path));
        setStatus(`已同步 · ${state.items.length} 个文件`, "ok");
      } catch (error) {
        state.items = fallback.map(normalize);
        setStatus("GitHub 同步失败，显示内置索引", "warn");
        console.warn(error);
      }
      render();
    }

    $("search").addEventListener("input", (event) => { state.query = event.target.value; render(); });
    $("client").addEventListener("change", (event) => { state.client = event.target.value; render(); });
    $("format").addEventListener("change", (event) => { state.format = event.target.value; render(); });
    load();
  </script>
</body>
</html>
